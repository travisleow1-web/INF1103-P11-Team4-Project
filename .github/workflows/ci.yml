name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the tests (no network, no Gemini, no MongoDB)
        run: python -m pytest -q

  docker:
    name: Docker build and tests in the container
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t supply-chain-risk .
      - name: Run the tests inside the container
        run: docker run --rm supply-chain-risk python -m pytest -q
      - name: Start the app in demo mode and check it answers
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=1 supply-chain-risk
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then echo "App is up"; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
